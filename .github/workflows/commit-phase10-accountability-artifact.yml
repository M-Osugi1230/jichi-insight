name: Commit Phase 10 Accountability Artifact

on:
  push:
    branches:
      - agent/phase10-progress-sync
    paths:
      - .github/workflows/commit-phase10-accountability-artifact.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Download reviewed accountability artifact
        uses: actions/download-artifact@v4
        with:
          name: phase10-accountability-source-candidates
          path: downloaded-accountability
          run-id: 30689628228
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install reviewed registry
        run: |
          cp downloaded-accountability/phase10_nationwide_accountability_linkage.json \
            data/catalog/phase10_nationwide_accountability_linkage.json
      - name: Commit reviewed registry
        run: |
          if [ -z "$(git status --porcelain -- data/catalog/phase10_nationwide_accountability_linkage.json)" ]; then
            echo "Registry is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog/phase10_nationwide_accountability_linkage.json
          git commit -m "Generate Phase 10 accountability coverage"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
