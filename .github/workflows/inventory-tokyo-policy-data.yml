name: Inventory Tokyo Policy Data

on:
  push:
    branches:
      - agent/phase10-tokyo-actual-linkage
    paths:
      - .github/workflows/inventory-tokyo-policy-data.yml
      - scripts/inventory_tokyo_policy_data.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/inventory-tokyo-policy-data.yml
      - scripts/inventory_tokyo_policy_data.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory Tokyo data and plan markers
        run: python scripts/inventory_tokyo_policy_data.py
      - uses: actions/upload-artifact@v4
        with:
          name: tokyo-policy-inventory
          path: tokyo-policy-inventory.json
          if-no-files-found: error
          retention-days: 7
