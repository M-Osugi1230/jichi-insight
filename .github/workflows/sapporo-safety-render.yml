name: Sapporo Safety Apply

on:
  push:
    branches:
      - phase13-sapporo-safety-security-complete

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[sapporo-safety-data]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase13-sapporo-safety-security-complete
      - name: Write reviewed field data and advance canonical state
        env:
          PART2_GZ_B64: 
          EVIDENCE_GZ_B64: 
        run: |
          python - <<'PY'
          import base64, gzip, json, os
          from pathlib import Path

          def decode(env_name, path):
              data = gzip.decompress(base64.b64decode(os.environ[env_name]))
              Path(path).write_bytes(data)

          decode('PART2_GZ_B64', 'data/catalog/sapporo_action_plan_safety_security_projects_part2.json')
          decode('EVIDENCE_GZ_B64', 'data/evidence/sapporo_action_plan_safety_security_projects_part2_evidence.json')

          index_path = Path('data/catalog/sapporo_action_plan_project_source_index.json')
          index = json.loads(index_path.read_text(encoding='utf-8'))
          index['reviewed_at'] = '2026-08-12'
          safety = next(r for r in index['machizukuri_field_sources'] if r['field_id'] == 'safety_security')
          safety.update({
              'content_review_status': 'record_review_complete_at_declared_fields',
              'reviewed_project_record_count': 70,
              'field_total_project_count': 70,
              'field_total_project_count_reviewed': True,
              'intro_page_label': 79,
              'intro_page_contains_project_rows': False,
              'reviewed_page_labels': list(range(80, 89)),
              'record_catalog_paths': [
                  'data/catalog/sapporo_action_plan_safety_security_projects_part1.json',
                  'data/catalog/sapporo_action_plan_safety_security_projects_part2.json',
              ],
              'evidence_paths': [
                  'data/evidence/sapporo_action_plan_safety_security_projects_part1_evidence.json',
                  'data/evidence/sapporo_action_plan_safety_security_projects_part2_evidence.json',
              ],
          })
          index['summary']['per_document_project_counts_reviewed'] = 1
          index['summary']['individual_project_records_reviewed'] = 70
          index['quality_boundary'] = (
              'The official Action Plan landing identifies eight Chapter 2 field documents plus two Chapter 3 administrative/fiscal documents and separately reports a plan-level total of 599 planned projects. The complete 10-page safety/security field document is now visually reviewed at declared row depth: printed page 79 has no project rows, and printed pages 80-88 contain 70 projects. Main-project rows retain their printed target fields while その他の事業 rows remain limited to identity, planned cost, and responsible department. This establishes the safety/security field count only; it does not allocate the remaining 529 projects among other documents, infer counts from page counts, assume Chapter 3 denominator membership, merge plan projects with the separate annual-progress 403-item denominator, or promote project descriptions or policy achievement.'
          )
          index['next_action'] = (
              'Safety/security is complete at declared project-row depth with 70 projects. Continue record-level review across the other seven Chapter 2 field PDFs, then independently determine Chapter 3 membership in the 599-project denominator before reconciling complete Action Plan coverage.'
          )
          index_path.write_text(json.dumps(index, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          sources_path = Path('data/catalog/sapporo_policy_sources.json')
          sources = json.loads(sources_path.read_text(encoding='utf-8'))
          sources['updated_at'] = '2026-08-12'
          src = next(r for r in sources['records'] if r['id'] == 'sapporo-action-plan-2023-projects-safety-security')
          src['review_status'] = 'reviewed_for_complete_field_project_inventory'
          src['notes'] = '公式10ページPDFを全ページ画像レビュー。印刷79ページは事業表なし、80～88ページの事業表に70事業を確認。主な事業43件は事業名・担当部・計画事業費・事業目標等、その他27件は事業名・担当部・計画事業費をReviewed化。599事業全体や年度進捗403項目との接続は未実施。'
          sources_path.write_text(json.dumps(sources, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          manifest_path = Path('data/catalog/sapporo_phase13_policy_review_manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['reviewed_at'] = '2026-08-12'
          manifest['reviewed_facts'] = [f for f in manifest['reviewed_facts'] if f['id'] != 'action-plan-safety-security-project-records-complete']
          manifest['reviewed_facts'].append({
              'id': 'action-plan-safety-security-project-records-complete',
              'layer': 'implementation_plan',
              'field': 'reviewed_field_project_record_count',
              'value': 70,
              'unit': 'projects',
              'main_project_record_count': 43,
              'other_project_record_count': 27,
              'source_id': 'sapporo-action-plan-2023-projects-safety-security',
              'registry_paths': [
                  'data/catalog/sapporo_action_plan_safety_security_projects_part1.json',
                  'data/catalog/sapporo_action_plan_safety_security_projects_part2.json',
              ],
              'evidence_paths': [
                  'data/evidence/sapporo_action_plan_safety_security_projects_part1_evidence.json',
                  'data/evidence/sapporo_action_plan_safety_security_projects_part2_evidence.json',
              ],
              'source_page_labels': list(range(80, 89)),
              'review_status': 'reviewed_field_complete_at_declared_fields',
              'location_note': '分野4「安全・安心」PDF全10ページを画像レビュー。印刷79ページに事業行がないことを確認し、80～88ページの70事業を1対1 Evidence付きでレビュー。',
              'interpretation_boundary': '分野4の70事業分母は確定したが、主な事業43件とその他27件はソース上の項目粒度が異なる。事業内容欄、599事業全体での通し順、第3章の分母包含、年度進捗403項目との接続、政策達成度・因果効果はここから推論しない。',
          })
          manifest['quality_boundary'] = '実施計画の期間・計画事業数599・計画事業費、公式資料10本の索引、分野4「安全・安心」PDF全10ページと70事業、2024年度報告の成果指標前年値26件、2025年度報告の成果指標最新行26件をReviewed化した。安全・安心70件は主な事業43件とその他27件で公開項目の粒度が異なり、後者に事業目標を推測補完しない。安全・安心分野が完了しても599事業全体、第3章資料の分母包含、年度進捗403項目との接続は未完了である。市の自己評価・傾向表現をJichi Insight独自の政策達成判定、因果推論、他都市比較には使用しない。'
          manifest['remaining_work'] = [
              '第2次戦略ビジョン本体の政策目標・成果指標をページ単位でレビューする。',
              'アクションプラン2023は分野4「安全・安心」70事業の個票レビューを完了。次に残る7分野をレコード単位でレビューし、599事業全体のカバー率を上げ、第3章資料が599事業分母へ含まれる範囲も確定する。',
              '成果指標26項目の正式名称、前年値26件、最新行26件はレビュー完了。次に年度進捗の主な事業403項目をレコード単位でレビューし、計画事業との接続候補を証拠単位で確認する。',
              '財政レコードとの事業単位リンクは名称・年度・会計状態を照合した後に別工程で行う。',
          ]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit reviewed safety field
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog/sapporo_action_plan_safety_security_projects_part2.json \
                  data/evidence/sapporo_action_plan_safety_security_projects_part2_evidence.json \
                  data/catalog/sapporo_action_plan_project_source_index.json \
                  data/catalog/sapporo_policy_sources.json \
                  data/catalog/sapporo_phase13_policy_review_manifest.json
          git commit -m "feat: complete Sapporo safety project review [sapporo-safety-data]"
          git push origin HEAD:phase13-sapporo-safety-security-complete
