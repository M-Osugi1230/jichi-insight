name: Verify Pages Publication

on:
  push:
    branches:
      - main
    paths-ignore:
      - .github/publication-status.json
  workflow_run:
    workflows:
      - Deploy Pages
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: verify-pages-publication
  cancel-in-progress: false

jobs:
  verify:
    name: Verify public site
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Verify deployed pages
        id: verify
        continue-on-error: true
        env:
          SITE_ROOT: https://m-osugi1230.github.io/jichi-insight
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -uo pipefail
          cache_bust="verify=${DEPLOYED_SHA}"
          : > /tmp/verification.log
          for attempt in $(seq 1 20); do
            home_code=$(curl --silent --show-error --location --output /tmp/home.html --write-out '%{http_code}' "${SITE_ROOT}/?${cache_bust}" || true)
            miyagi_code=$(curl --silent --show-error --location --output /tmp/miyagi.html --write-out '%{http_code}' "${SITE_ROOT}/municipalities/miyagi/?${cache_bust}" || true)
            robots_code=$(curl --silent --show-error --location --output /tmp/robots.txt --write-out '%{http_code}' "${SITE_ROOT}/robots.txt?${cache_bust}" || true)
            sitemap_code=$(curl --silent --show-error --location --output /tmp/sitemap.xml --write-out '%{http_code}' "${SITE_ROOT}/sitemap.xml?${cache_bust}" || true)
            home_copy=false; grep -Eq '508(<!-- -->)?件の実績推移を公開' /tmp/home.html 2>/dev/null && home_copy=true
            miyagi_targets=false; grep -Eq '全(<!-- -->)?128(<!-- -->)?目標' /tmp/miyagi.html 2>/dev/null && miyagi_targets=true
            miyagi_actuals=false; grep -Eq '508(<!-- -->)?件の実績' /tmp/miyagi.html 2>/dev/null && miyagi_actuals=true
            robots_sitemap=false; grep -Fq 'Sitemap:' /tmp/robots.txt 2>/dev/null && robots_sitemap=true
            sitemap_miyagi=false; grep -Fq '/jichi-insight/municipalities/miyagi' /tmp/sitemap.xml 2>/dev/null && sitemap_miyagi=true
            printf 'attempt=%s home=%s miyagi=%s robots=%s sitemap=%s home_copy=%s miyagi_targets=%s miyagi_actuals=%s robots_sitemap=%s sitemap_miyagi=%s\n' \
              "$attempt" "$home_code" "$miyagi_code" "$robots_code" "$sitemap_code" "$home_copy" "$miyagi_targets" "$miyagi_actuals" "$robots_sitemap" "$sitemap_miyagi" | tee -a /tmp/verification.log
            if [ "$home_code" = 200 ] && [ "$miyagi_code" = 200 ] && [ "$robots_code" = 200 ] && [ "$sitemap_code" = 200 ] \
              && [ "$home_copy" = true ] && [ "$miyagi_targets" = true ] && [ "$miyagi_actuals" = true ] \
              && [ "$robots_sitemap" = true ] && [ "$sitemap_miyagi" = true ]; then
              echo verified > /tmp/verification-status
              exit 0
            fi
            sleep 15
          done
          echo failed > /tmp/verification-status
          exit 1

      - name: Record publication status
        if: always()
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          WORKFLOW_RUN_URL: ${{ github.event.workflow_run.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          export VERIFIED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          export STATUS=$(cat /tmp/verification-status 2>/dev/null || echo failed)
          export DIAGNOSTIC=$(tail -n 1 /tmp/verification.log 2>/dev/null || echo 'verification did not start')
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('.github/publication-status.json').write_text(
              json.dumps(
                  {
                      'status': os.environ['STATUS'],
                      'site_url': 'https://m-osugi1230.github.io/jichi-insight/',
                      'deployed_commit_sha': os.environ['DEPLOYED_SHA'],
                      'verified_at': os.environ['VERIFIED_AT'],
                      'deployment_workflow_run_url': os.environ['WORKFLOW_RUN_URL'],
                      'verification_outcome': os.environ['VERIFY_OUTCOME'],
                      'diagnostic': os.environ['DIAGNOSTIC'],
                  },
                  ensure_ascii=False,
                  indent=2,
              ) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit publication status
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/publication-status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Pages publication status"
          git push origin HEAD:main

      - name: Fail when public verification failed
        if: steps.verify.outcome != 'success'
        run: exit 1
