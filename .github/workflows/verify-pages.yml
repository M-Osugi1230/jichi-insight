name: Verify Pages Publication

on:
  push:
    branches:
      - main
    paths-ignore:
      - .github/publication-status.json
  workflow_run:
    workflows:
      - Deploy Pages
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: verify-pages-publication
  cancel-in-progress: true

jobs:
  verify:
    name: Verify public site
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify deployed pages
        env:
          SITE_ROOT: https://m-osugi1230.github.io/jichi-insight
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          cache_bust="verify=${DEPLOYED_SHA}"
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --location \
              "${SITE_ROOT}/?${cache_bust}" -o /tmp/home.html \
              && curl --fail --silent --show-error --location \
              "${SITE_ROOT}/municipalities/miyagi/?${cache_bust}" -o /tmp/miyagi.html \
              && curl --fail --silent --show-error --location \
              "${SITE_ROOT}/robots.txt?${cache_bust}" -o /tmp/robots.txt \
              && curl --fail --silent --show-error --location \
              "${SITE_ROOT}/sitemap.xml?${cache_bust}" -o /tmp/sitemap.xml \
              && grep -Fq "508件の実績推移を公開" /tmp/home.html \
              && grep -Fq "全128目標" /tmp/miyagi.html \
              && grep -Fq "508件の実績" /tmp/miyagi.html \
              && grep -Fq "Sitemap:" /tmp/robots.txt \
              && grep -Fq "/jichi-insight/municipalities/miyagi/" /tmp/sitemap.xml; then
              echo "Public verification passed on attempt ${attempt}."
              exit 0
            fi
            echo "Public site is not current yet; retrying (${attempt}/20)."
            sleep 15
          done
          echo "Public verification failed after all retries."
          exit 1

      - name: Record verified deployment
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          WORKFLOW_RUN_URL: ${{ github.event.workflow_run.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: |
          set -euo pipefail
          verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > .github/publication-status.json <<EOF
          {
            "status": "verified",
            "site_url": "https://m-osugi1230.github.io/jichi-insight/",
            "deployed_commit_sha": "${DEPLOYED_SHA}",
            "verified_at": "${verified_at}",
            "deployment_workflow_run_url": "${WORKFLOW_RUN_URL}",
            "checks": [
              "homepage_http_200",
              "homepage_508_annual_results",
              "miyagi_page_http_200",
              "miyagi_128_targets",
              "miyagi_508_annual_results",
              "robots_http_200_and_sitemap_declared",
              "sitemap_http_200_and_miyagi_route_present"
            ]
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/publication-status.json
          if git diff --cached --quiet; then
            echo "Publication marker already current."
            exit 0
          fi
          git commit -m "Record verified Pages deployment"
          git push origin HEAD:main
