name: Sapporo Outcome Extract

on:
  push:
    branches:
      - phase13-sapporo-outcomes-2025

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
      - name: Download official Sapporo outcome report
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen

          url = "https://www.city.sapporo.jp/chosei/documents/ap2023_houkoku2025_seikashihyo.pdf"
          req = Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urlopen(req, timeout=60) as response:
              data = response.read()
          Path("sapporo2025.pdf").write_bytes(data)
          print(f"downloaded={len(data)} bytes")
          if not data.startswith(b"%PDF"):
              raise SystemExit("downloaded payload is not a PDF")
          PY
      - name: Render report pages
        run: |
          echo "pages=$(pdfinfo sapporo2025.pdf | awk '/Pages:/ {print $2}')"
          mkdir -p rendered
          pdftoppm -png -r 200 sapporo2025.pdf rendered/page >/dev/null
          ls -lh rendered
      - uses: actions/upload-artifact@v4
        with:
          name: sapporo-outcome-2025-rendered
          path: |
            rendered/*.png
            sapporo2025.pdf
          retention-days: 1
