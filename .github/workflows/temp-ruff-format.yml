name: Temporary Ruff Format

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Format Sapporo Phase 13 tests
        run: |
          ruff format \
            tests/test_phase13_sapporo_action_plan_project_source_index.py \
            tests/test_phase13_sapporo_candidate_queue_registry.py \
            tests/test_phase13_sapporo_children_youth_main_project_candidates.py \
            tests/test_phase13_sapporo_children_youth_other_project_candidates.py \
            tests/test_phase13_sapporo_community_project_candidates.py \
            tests/test_phase13_sapporo_economy_project_candidates.py \
            tests/test_phase13_sapporo_environment_project_candidates.py \
            tests/test_phase13_sapporo_life_living_page68_candidates.py \
            tests/test_phase13_sapporo_life_living_projects_batch1.py \
            tests/test_phase13_sapporo_life_living_projects_batch2.py \
            tests/test_phase13_sapporo_life_living_projects_batch3_pages69_71.py \
            tests/test_phase13_sapporo_policy_review.py \
            tests/test_phase13_sapporo_safety_security_projects_part1.py \
            tests/test_phase13_sapporo_sports_culture_projects.py \
            tests/test_phase13_sapporo_urban_space_projects.py
          ruff check scripts tests --output-format=concise
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
          else
            git commit -m "Format Sapporo Phase 13 tests"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
