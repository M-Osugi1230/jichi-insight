name: Sapporo Outcome Finish

on:
  push:
    branches:
      - phase13-sapporo-outcomes-2025

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[sapporo-finish]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase13-sapporo-outcomes-2025
      - name: Synchronize historical layer progress pointer
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/catalog/sapporo_outcome_indicator_2024_report_values.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['summary']['latest_2025_values_reviewed_count'] = 26
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit synchronization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog/sapporo_outcome_indicator_2024_report_values.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: sync Sapporo current review count [sapporo-finish]"
          git push origin HEAD:phase13-sapporo-outcomes-2025
