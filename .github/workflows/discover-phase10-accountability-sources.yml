name: Discover Phase 10 Accountability Sources

on:
  push:
    branches:
      - agent/phase10-progress-sync
    paths:
      - .github/workflows/discover-phase10-accountability-sources.yml
      - scripts/discover_phase10_accountability_sources.py
      - data/catalog/phase10_reference_depth_reviews.json
      - data/catalog/phase10_anchor_depth_reviews.json
      - data/catalog/phase10_*_depth_reviews.json
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/discover-phase10-accountability-sources.yml
      - scripts/discover_phase10_accountability_sources.py
      - data/catalog/phase10_reference_depth_reviews.json
      - data/catalog/phase10_anchor_depth_reviews.json
      - data/catalog/phase10_*_depth_reviews.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install discovery dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Discover official accountability source candidates
        run: |
          python scripts/discover_phase10_accountability_sources.py \
            --output extracted-phase10-accountability/candidates.json \
            --summary extracted-phase10-accountability/summary.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase10-accountability-source-candidates
          path: extracted-phase10-accountability
          if-no-files-found: error
          retention-days: 7
