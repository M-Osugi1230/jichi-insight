name: Discover Phase 10 Accountability Sources

on:
  push:
    branches:
      - agent/phase10-progress-sync
    paths:
      - .github/workflows/discover-phase10-accountability-sources.yml
      - scripts/discover_phase10_accountability_sources.py
      - scripts/build_phase10_accountability_linkage.py
      - data/catalog/phase10_reference_depth_reviews.json
      - data/catalog/phase10_anchor_depth_reviews.json
      - data/catalog/phase10_*_depth_reviews.json
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/discover-phase10-accountability-sources.yml
      - scripts/discover_phase10_accountability_sources.py
      - scripts/build_phase10_accountability_linkage.py
      - data/catalog/phase10_reference_depth_reviews.json
      - data/catalog/phase10_anchor_depth_reviews.json
      - data/catalog/phase10_*_depth_reviews.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Install discovery dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Discover official accountability source candidates
        run: |
          python scripts/discover_phase10_accountability_sources.py \
            --output extracted-phase10-accountability/candidates.json \
            --summary extracted-phase10-accountability/summary.md
      - name: Build reviewed accountability linkage registry
        run: |
          python scripts/build_phase10_accountability_linkage.py \
            --candidates extracted-phase10-accountability/candidates.json \
            --output data/catalog/phase10_nationwide_accountability_linkage.json
          cp data/catalog/phase10_nationwide_accountability_linkage.json \
            extracted-phase10-accountability/phase10_nationwide_accountability_linkage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase10-accountability-source-candidates
          path: extracted-phase10-accountability
          if-no-files-found: error
          retention-days: 7
      - name: Commit reviewed accountability registry
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- data/catalog/phase10_nationwide_accountability_linkage.json; then
            echo "Registry is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog/phase10_nationwide_accountability_linkage.json
          git commit -m "Generate Phase 10 accountability coverage"
          git push origin HEAD:${{ github.ref_name }}
