name: Build Phase 10 Nationwide Core Linkage

on:
  push:
    branches:
      - agent/phase10-progress-sync
    paths:
      - .github/workflows/build-phase10-core-linkage.yml
      - scripts/build_phase10_nationwide_core_linkage.py
      - data/catalog/phase10_reference_depth_reviews.json
      - data/catalog/phase10_anchor_depth_reviews.json
      - data/catalog/phase10_*_depth_reviews.json
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build-phase10-core-linkage.yml
      - scripts/build_phase10_nationwide_core_linkage.py
      - data/catalog/phase10_reference_depth_reviews.json
      - data/catalog/phase10_anchor_depth_reviews.json
      - data/catalog/phase10_*_depth_reviews.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Generate nationwide core linkage registry
        run: |
          python scripts/build_phase10_nationwide_core_linkage.py \
            --output data/catalog/phase10_nationwide_core_linkage.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase10-nationwide-core-linkage
          path: data/catalog/phase10_nationwide_core_linkage.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit generated registry
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- data/catalog/phase10_nationwide_core_linkage.json; then
            echo "Registry is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog/phase10_nationwide_core_linkage.json
          git commit -m "Generate Phase 10 nationwide core linkage"
          git push origin HEAD:${{ github.ref_name }}
