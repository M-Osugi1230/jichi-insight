name: Extract Tokyo Children Policy Review

on:
  push:
    branches:
      - agent/phase10-tokyo-actual-linkage
    paths:
      - .github/workflows/extract-tokyo-children-review.yml
      - scripts/extract_tokyo_children_review_candidates.py
      - scripts/extract_tokyo_children_actual_linkage.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/extract-tokyo-children-review.yml
      - scripts/extract_tokyo_children_review_candidates.py
      - scripts/extract_tokyo_children_actual_linkage.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Install extraction dependency
        run: python -m pip install --disable-pip-version-check pdfplumber
      - name: Download official 2050 Tokyo Strategy policy review
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/tokyo-policy-review-2025.pdf \
            https://www.seisakukikaku.metro.tokyo.lg.jp/documents/d/seisakukikaku/policy-review_2025
      - name: Extract cross-version candidates
        run: |
          python scripts/extract_tokyo_children_review_candidates.py \
            --catalog data/entities/policy/tokyo_policy_target_catalog_children.json \
            --review-pdf /tmp/tokyo-policy-review-2025.pdf \
            --output-dir extracted-tokyo-children-review
      - name: Create reviewed linkage registry
        run: |
          python scripts/extract_tokyo_children_actual_linkage.py \
            --catalog data/entities/policy/tokyo_policy_target_catalog_children.json \
            --review-pdf /tmp/tokyo-policy-review-2025.pdf \
            --output-dir extracted-tokyo-children-reviewed
      - name: Commit reviewed registry
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          cp extracted-tokyo-children-reviewed/tokyo_children_annual_actual_linkage.json data/catalog/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog/tokyo_children_annual_actual_linkage.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update Tokyo children annual actual linkage"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tokyo-children-review-candidates
          path: |
            extracted-tokyo-children-review
            extracted-tokyo-children-reviewed
          if-no-files-found: error
          retention-days: 7
