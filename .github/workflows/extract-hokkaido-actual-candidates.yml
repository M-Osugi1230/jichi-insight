name: Extract Hokkaido Annual Actual Candidates

on:
  push:
    branches:
      - agent/phase10-hokkaido-actual-linkage
    paths:
      - .github/workflows/extract-hokkaido-actual-candidates.yml
      - scripts/extract_hokkaido_actual_candidates.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/extract-hokkaido-actual-candidates.yml
      - scripts/extract_hokkaido_actual_candidates.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install extraction dependency
        run: python -m pip install --disable-pip-version-check pdfplumber
      - name: Download official FY2024 progress PDFs
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/hokkaido-direction-1.pdf \
            'https://www.pref.hokkaido.lg.jp/fs/1/2/2/1/7/9/6/5/_/%E5%9F%BA%E6%9C%AC%E6%96%B9%E5%90%911.pdf'
          curl --fail --location --retry 3 \
            --output /tmp/hokkaido-direction-2.pdf \
            'https://www.pref.hokkaido.lg.jp/fs/1/2/2/1/7/9/6/6/_/%E5%9F%BA%E6%9C%AC%E6%96%B9%E5%90%912.pdf'
          curl --fail --location --retry 3 \
            --output /tmp/hokkaido-direction-3.pdf \
            'https://www.pref.hokkaido.lg.jp/fs/1/2/2/1/7/9/6/7/_/%E5%9F%BA%E6%9C%AC%E6%96%B9%E5%90%913.pdf'
      - name: Extract candidate rows
        run: |
          python scripts/extract_hokkaido_actual_candidates.py \
            --pdf /tmp/hokkaido-direction-1.pdf \
            --pdf /tmp/hokkaido-direction-2.pdf \
            --pdf /tmp/hokkaido-direction-3.pdf \
            --catalog-root data/entities/policy \
            --output-dir extracted-hokkaido-actuals
      - uses: actions/upload-artifact@v4
        with:
          name: hokkaido-annual-actual-candidates
          path: extracted-hokkaido-actuals
          if-no-files-found: error
          retention-days: 7
