name: Extract Hokkaido Annual Actual Candidates

on:
  push:
    branches:
      - agent/phase10-hokkaido-actual-linkage
    paths:
      - .github/workflows/extract-hokkaido-actual-candidates.yml
      - scripts/extract_hokkaido_actual_candidates.py
      - scripts/extract_hokkaido_actual_linkage.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/extract-hokkaido-actual-candidates.yml
      - scripts/extract_hokkaido_actual_candidates.py
      - scripts/extract_hokkaido_actual_linkage.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Install extraction dependency
        run: python -m pip install --disable-pip-version-check pdfplumber
      - name: Download official FY2024 progress PDFs
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/hokkaido-direction-1.pdf \
            'https://www.pref.hokkaido.lg.jp/fs/1/2/2/1/7/9/6/5/_/%E5%9F%BA%E6%9C%AC%E6%96%B9%E5%90%911.pdf'
          curl --fail --location --retry 3 \
            --output /tmp/hokkaido-direction-2.pdf \
            'https://www.pref.hokkaido.lg.jp/fs/1/2/2/1/7/9/6/6/_/%E5%9F%BA%E6%9C%AC%E6%96%B9%E5%90%912.pdf'
          curl --fail --location --retry 3 \
            --output /tmp/hokkaido-direction-3.pdf \
            'https://www.pref.hokkaido.lg.jp/fs/1/2/2/1/7/9/6/7/_/%E5%9F%BA%E6%9C%AC%E6%96%B9%E5%90%913.pdf'
      - name: Extract candidate rows
        run: |
          python scripts/extract_hokkaido_actual_candidates.py \
            --pdf /tmp/hokkaido-direction-1.pdf \
            --pdf /tmp/hokkaido-direction-2.pdf \
            --pdf /tmp/hokkaido-direction-3.pdf \
            --catalog-root data/entities/policy \
            --output-dir extracted-hokkaido-candidates
      - name: Create reviewed linkage registry
        run: |
          python scripts/extract_hokkaido_actual_linkage.py \
            --pdf /tmp/hokkaido-direction-1.pdf \
            --pdf /tmp/hokkaido-direction-2.pdf \
            --pdf /tmp/hokkaido-direction-3.pdf \
            --catalog-root data/entities/policy \
            --output-dir extracted-hokkaido-reviewed
      - name: Commit reviewed registries
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          cp extracted-hokkaido-reviewed/hokkaido_annual_actual_linkage*.json data/catalog/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog/hokkaido_annual_actual_linkage*.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update Hokkaido annual actual linkage"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hokkaido-annual-actual-candidates
          path: |
            extracted-hokkaido-candidates
            extracted-hokkaido-reviewed
          if-no-files-found: error
          retention-days: 7
