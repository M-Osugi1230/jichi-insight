name: Finalize Phase 10

on:
  push:
    branches:
      - agent/phase10-progress-sync
    paths:
      - .github/workflows/finalize-phase10.yml
      - scripts/finalize_phase10.py
      - scripts/finalize_phase10_public_page.py
      - data/catalog/phase10_nationwide_core_linkage.json
      - data/catalog/phase10_nationwide_accountability_linkage.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Finalize canonical Phase 10 state
        run: |
          python scripts/finalize_phase10.py
          python scripts/finalize_phase10_public_page.py
      - name: Commit final Phase 10 state
        run: |
          if git diff --quiet; then
            echo "Phase 10 state is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/catalog/phase10_uniformity.json \
            data/catalog/phase10_execution_queue.json \
            data/catalog/phase10_completion.json \
            apps/web/lib/phase10.ts \
            apps/web/app/municipalities/phase10/page.tsx
          git commit -m "Finalize Phase 10 nationwide completion"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
