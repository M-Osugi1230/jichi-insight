name: Apply Chiba Field 8 Visual Review

on:
  push:
    branches:
      - phase13-chiba-field08-complete-visual
    paths:
      - .github/workflows/apply-chiba-field08-visual.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase13-chiba-field08-complete-visual

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply visually verified Field 8 mappings
        run: python scripts/apply_phase13_chiba_field08_visual_review.py

      - name: Install validation tools
        run: python -m pip install --disable-pip-version-check pytest ruff

      - name: Run targeted Phase 13 tests
        run: |
          python -m pytest -q \
            tests/test_phase13_chiba_project_work_items_field08.py \
            tests/test_phase13_chiba_project_work_item_alignment.py \
            tests/test_phase13_chiba_project_work_item_visual_review_queue.py \
            tests/test_phase13_chiba_policy_indicators.py
          python scripts/build_chiba_work_item_visual_review_queue.py --check

      - name: Lint changed Python
        run: |
          ruff check \
            scripts/build_chiba_work_item_visual_review_queue.py \
            scripts/apply_phase13_chiba_field08_visual_review.py \
            tests/test_phase13_chiba_project_work_items_field08.py \
            tests/test_phase13_chiba_project_work_item_alignment.py \
            tests/test_phase13_chiba_project_work_item_visual_review_queue.py \
            tests/test_phase13_chiba_policy_indicators.py

      - name: Run full repository tests
        run: python -m pytest -q

      - name: Commit reviewed data and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            data/catalog/chiba_current_project_identities_field08.json \
            data/reviewed/chiba-city/current_project_work_items_field08.json \
            data/evidence/chiba_current_project_work_items_field08_evidence.json \
            data/catalog/chiba_current_project_work_item_review_manifest.json \
            data/catalog/chiba_current_project_work_item_visual_review_queue.json \
            data/catalog/chiba_phase13_policy_review_manifest.json \
            data/reviewed/chiba-city/plan_review.json \
            scripts/build_chiba_work_item_visual_review_queue.py \
            tests/test_phase13_chiba_project_work_items_field08.py \
            tests/test_phase13_chiba_project_work_item_alignment.py \
            tests/test_phase13_chiba_project_work_item_visual_review_queue.py \
            tests/test_phase13_chiba_policy_indicators.py
          git commit -m "Complete Chiba field 8 visual work-item review"
          git push origin HEAD:phase13-chiba-field08-complete-visual
