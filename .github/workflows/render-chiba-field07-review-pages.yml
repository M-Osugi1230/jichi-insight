name: Render Chiba Field 7 Review Pages

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'phase13-chiba-field07-complete-visual'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase13-chiba-field07-complete-visual

      - name: Install renderer
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Download and verify official plan PDF
        run: |
          curl -fL --retry 5 --retry-delay 2 \
            'https://www.city.chiba.jp/sogoseisaku/shichokoshitsu/hisho/hodo/documents/20260410-2-2.pdf' \
            -o /tmp/chiba-plan.pdf
          echo '347d636cee8cbdf1f96f2084844744e86875e26b4abaf3307d6dc703ce591fe6  /tmp/chiba-plan.pdf' | sha256sum -c -

      - name: Render exact PDF pages for field 7 pending projects
        run: |
          mkdir -p /tmp/chiba-field07-pages
          render_page() {
            pdf_page="$1"
            printed_page="$2"
            pdftoppm -f "$pdf_page" -l "$pdf_page" -r 180 -png -singlefile \
              /tmp/chiba-plan.pdf \
              "/tmp/chiba-field07-pages/printed-${printed_page}_pdf-${pdf_page}"
          }
          render_page 101 098
          render_page 103 100
          render_page 104 101
          render_page 110 107
          render_page 113 110
          render_page 115 112
          render_page 119 116
          render_page 121 118
          render_page 122 119
          cat > /tmp/chiba-field07-pages/index.txt <<'EOF'
          Official source SHA-256: 347d636cee8cbdf1f96f2084844744e86875e26b4abaf3307d6dc703ce591fe6
          Printed p.98  -> PDF physical page 101 -> chiba-f07-p006,p007
          Printed p.100 -> PDF physical page 103 -> chiba-f07-p011
          Printed p.101 -> PDF physical page 104 -> chiba-f07-p013
          Printed p.107 -> PDF physical page 110 -> chiba-f07-p017
          Printed p.110 -> PDF physical page 113 -> chiba-f07-p022
          Printed p.112 -> PDF physical page 115 -> chiba-f07-p023
          Printed p.116 -> PDF physical page 119 -> chiba-f07-p025
          Printed p.118 -> PDF physical page 121 -> chiba-f07-p029
          Printed p.119 -> PDF physical page 122 -> chiba-f07-p032
          EOF

      - name: Upload rendered review pages
        uses: actions/upload-artifact@v4
        with:
          name: chiba-field07-review-pages
          path: /tmp/chiba-field07-pages
          retention-days: 7
