name: Inventory Miyagi Data

on:
  push:
    branches:
      - agent/phase10-miyagi-money-linkage
    paths:
      - .github/workflows/inventory-miyagi-data.yml
      - scripts/inventory_miyagi_data.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Miyagi inventory
        run: python scripts/inventory_miyagi_data.py
      - uses: actions/upload-artifact@v4
        with:
          name: miyagi-data-inventory
          path: miyagi-data-inventory.json
          if-no-files-found: error
          retention-days: 7
